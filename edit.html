<html lang="id">

<head>

    ```
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    ```

</head>

<body>

    ```
    <!-- ================= SIDEBAR ================= -->

    <div class="sidebar">

        <div>

            <h2>🍱 MBG AI</h2>

            <ul>

                <li>
                    <a href="index.html">
                        📊 Dashboard
                    </a>
                </li>

                <li>
                    <a href="histori.html">
                        📜 Histori
                    </a>
                </li>

                <li class="active">
                    <a href="#">
                        ✏️ Edit Laporan
                    </a>
                </li>

            </ul>

        </div>

        <div class="sidebar-footer">

            <div class="ai-status">

                <div class="ai-dot"></div>

                <span>AI Active</span>

            </div>

            <small>
                YOLOv8 + FastAPI
            </small>

        </div>

    </div>


    <!-- ================= MAIN ================= -->

    <div class="main">

        <!-- ================= NAVBAR ================= -->

        <div class="navbar">

            <div>

                <h3>
                    ✏️ Edit Laporan
                </h3>

                <p>
                    Perbarui informasi laporan hasil analisis MBG
                </p>

            </div>

        </div>


        <form id="editForm">
        
            <div class="form-group">
        
                <label for="tanggal">
                    Tanggal
                </label>
        
                <input type="text" id="tanggal" readonly>
        
            </div>
        
            <div class="form-group">
        
                <label for="status">
                    Status Gizi
                </label>
        
                <select id="status">
        
                    <option value="Bergizi">
                        🟢 Bergizi
                    </option>
        
                    <option value="Kurang Bergizi">
                        🟡 Kurang Bergizi
                    </option>
        
                    <option value="Tidak Bergizi">
                        🔴 Tidak Bergizi
                    </option>
        
                </select>
        
            </div>
        
            <div class="form-group">
        
                <label for="kalori">
                    Total Kalori (kkal)
                </label>
        
                <input type="number" id="kalori">
        
            </div>
        
            <div class="form-group">
        
                <label for="protein">
                    Total Protein (g)
                </label>
        
                <input type="number" id="protein">
        
            </div>
        
            <div class="form-group">
        
                <label for="karbo">
                    Total Karbohidrat (g)
                </label>
        
                <input type="number" id="karbo">
        
            </div>
        
            <div class="form-group">
        
                <label for="lemak">
                    Total Lemak (g)
                </label>
        
                <input type="number" id="lemak">
        
            </div>
        
            <div class="hero-btn">
        
                <button type="submit" class="primary">
        
                    💾 Simpan Perubahan
        
                </button>
        
                <button type="button" class="secondary" onclick="history.back()">
        
                    ⬅️ Kembali
        
                </button>
        
            </div>
        
        </form>


        <!-- ================= FOOTER ================= -->

        <footer class="footer">

            <p>

                © 2026 MBG AI —
                Sistem Edit Laporan Gizi

            </p>

        </footer>

    </div>

    <script src="js/edit.js"></script>
    ```

</body>

</html>
